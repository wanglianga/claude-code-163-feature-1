server:
  port: 8080

spring:
  application:
    name: manhole-platform
  datasource:
    url: jdbc:postgresql://localhost:5433/manhole
    username: postgres
    password: ""
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  jackson:
    time-zone: Asia/Shanghai

app:
  upload-dir: uploads
  repair-timeout-hours: 48
  # 应急处置到场时限（分钟），按危险等级
  emergency-limit-minutes:
    high: 120
    mid: 240
    low: 480
  # 夜间临时围护巡查时限（分钟）：警示锥移位距上次巡查超过该值判定为巡查间隔过长
  night-patrol-limit-minutes: 180
