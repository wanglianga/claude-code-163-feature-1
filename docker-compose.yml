# 一键启动：PostgreSQL + Spring Boot 后端 + Nginx/Vue 前端
# 启动：docker compose up -d --build
# 访问：http://localhost:5180   （后端直连 http://localhost:8080）
services:
  db:
    image: postgres:15
    container_name: manhole-db
    environment:
      POSTGRES_DB: manhole
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: manhole
    ports:
      - "5433:5432"
    volumes:
      - manhole-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d manhole"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: manhole-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/manhole
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: manhole
    ports:
      - "8080:8080"
    volumes:
      - manhole-uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: manhole-frontend
    depends_on:
      - backend
    ports:
      - "5180:80"

volumes:
  manhole-pgdata:
  manhole-uploads:
